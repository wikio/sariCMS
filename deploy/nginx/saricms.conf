# Exemple mono-hôte Ubuntu. Remplacer le domaine avant nginx -t et Certbot.
server {
    listen 80;
    listen [::]:80;
    server_name cms.example.org;
    client_max_body_size 55m;

    # Aucun accès extérieur au relais interne de courrier ni au Swagger de l'API.
    location ~* ^/api/v1/(docs([/-]|$)|mail/internal(/|$)|auth/forgot-password(/|$)) { return 404; }
    location ~ /\.(?!well-known/) { return 404; }

    # Profil d'ouverture : catalogue + administration. Le tunnel commerce historique
    # n'est pas publié tant que droits par dossier, montants et réception serveur
    # ne sont pas garantis. L'admin passe par /api/admin/cms, authentifié par Next.
    location ~* ^/api/v1/(orders|quotes)(/|$) { return 403; }
    location ~* ^/((fr|en|ar)/)?(cart|payment)(/|$) { return 404; }

    # Fichiers créés APRÈS next build/start : servis immédiatement depuis le volume.
    # Une image SVG ouverte comme document ne doit pas pouvoir exécuter de code.
    location ~ ^/(uploads|canvas)/ {
        root /srv/saricms/shared/public;
        try_files $uri =404;
        autoindex off;
        disable_symlinks on from=/srv/saricms/shared/public;
        limit_except GET { deny all; }
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $server_name;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Nginx est le seul proxy public dans cette topologie.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
}
